name: Deploy bot to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME }}
        run: |
          set -eu
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_PATH VPS_SERVICE_NAME; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Missing GitHub secret/variable: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy repository files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='*.session' \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/"

      - name: Restart bot service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "sudo systemctl restart '${VPS_SERVICE_NAME}' && sudo systemctl is-active '${VPS_SERVICE_NAME}'"
